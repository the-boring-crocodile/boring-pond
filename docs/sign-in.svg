<text xml:space="preserve" text-anchor="start" x="22" y="-218.72" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#111111">Read the picture</text>
<text xml:space="preserve" text-anchor="start" x="22" y="-202.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111"> </text>
<text xml:space="preserve" text-anchor="start" x="22" y="-186.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Lane: who acts</text>
<text xml:space="preserve" text-anchor="start" x="22" y="-170.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Grey chip: a step of the sign&#45;in</text>
<text xml:space="preserve" text-anchor="start" x="22" y="-154.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#526c91">Pale blue chip: you</text>
<text xml:space="preserve" text-anchor="start" x="22" y="-138.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Arrows: the order of the steps</text>
<text xml:space="preserve" text-anchor="start" x="22" y="-122.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111"> </text>
<text xml:space="preserve" text-anchor="start" x="22" y="-106.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Each Pond has its own URL,</text>
<text xml:space="preserve" text-anchor="start" x="22" y="-90.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">/mcp/POND, and its own secret.</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-218.72" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00" fill="#111111">Tokens and scope</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-202.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111"> </text>
<text xml:space="preserve" text-anchor="start" x="202" y="-186.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Below the line the client holds</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-170.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">tokens for this one Pond:</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-154.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">access 1 hour, refresh 14 days.</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-138.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Refresh rotates both; revoking</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-122.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">one revokes its partner.</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-106.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Five wrong secrets cancel</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-90.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">the sign&#45;in.</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-74.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111"> </text>
<text xml:space="preserve" text-anchor="start" x="202" y="-58.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">Not shown: how a client is known</text>
<text xml:space="preserve" text-anchor="start" x="202" y="-42.88" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#111111">(metadata document, added by</text>
