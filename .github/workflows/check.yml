# The family check: all six repositories side by side, as on a workstation
# (scripts/check.py). Common is built from the commit the consumers'
# .common-ref names; check_common_ref.py makes sure that is the Common
# every lock pins, so the reproducible build matches the locks' hashes.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  family:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: boring-pond
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-crocodile
          path: boring-crocodile
      - id: common
        run: echo "ref=$(cat boring-crocodile/.common-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-pond-common
          path: boring-pond-common
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-pirates
          path: boring-pirates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-services
          path: boring-services
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-pondnt
          path: boring-pondnt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Common's own check runs on its checked-out HEAD; the consumers get the
      # wheels built from the ref they name, in a separate worktree.
      - run: git -C boring-pond-common worktree add ../.common-at-ref ${{ steps.common.outputs.ref }}
      - run: python .common-at-ref/scripts/build.py --out .common-dist
      - run: python boring-pond/scripts/check.py --common-wheels .common-dist
