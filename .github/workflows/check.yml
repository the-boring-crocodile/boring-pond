# The family runner builds the one Common ref all consumers name and uses
# pondNT's frozen Services ref in temporary detached worktrees.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  family:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: boring-pond
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-crocodile
          path: boring-crocodile
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-pond-common
          path: boring-pond-common
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-pirates
          path: boring-pirates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-services
          path: boring-services
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-pondnt
          path: boring-pondnt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # pondNT's browser tests drive Google Chrome. GitHub's Ubuntu 24.04 runners do
      # not allow its sandbox (user namespaces), so the tests get a wrapper without it.
      - run: |
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome-nosandbox"
          chmod +x "$RUNNER_TEMP/chrome-nosandbox"
          echo "D365WEB_TEST_BROWSER=$RUNNER_TEMP/chrome-nosandbox" >> "$GITHUB_ENV"
      - run: python boring-pond/scripts/check.py
